{% extends "app.html" %}
{% block content %}

<div class="container mt-5">
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="col-md-6 mx-auto card p-4 shadow-sm">
      <h3 class="text-center mb-3">Update Recipe</h3>
      <hr>

      <div class="mb-3">
        <label class="form-label">Recipe Name</label>
        <input type="text" name="receipe_name"
               value="{{ receipe.receipe_name }}"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Recipe Description</label>
        <textarea name="receipe_description"
                  rows="3"
                  class="form-control"
                  required>{{ receipe.receipe_description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Recipe Image</label><br>
        <input type="file" name="receipe_image" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Update Recipe
      </button>
    </div>
  </form>
</div>

{% endblock %}
